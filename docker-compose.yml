services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Run ./scripts/bootstrap.sh first}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      KG_MCP_TOKEN: "${KG_MCP_TOKEN}"
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      LLM_ENABLED: "${LLM_ENABLED:-false}"
      LLM_MODE: "${LLM_MODE:-litellm}"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:-}"
      LITELLM_API_KEY: "${LITELLM_API_KEY:-}"
      LITELLM_MODEL: "${LITELLM_MODEL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
    ports:
      - "127.0.0.1:${NEURAL_MEMORY_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  neo4j_data:
